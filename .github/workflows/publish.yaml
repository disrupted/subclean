name: Publish to PyPI

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
