name: Lint GitHub CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/**

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Lint actions and workflows
        uses: bakdata/ci-templates/actions/action-lint@dcb4d9d45060d891da1bc59f0657dceec112527c # https://github.com/bakdata/ci-templates/releases/tag/2.3.0
        with:
          action-lint-version: "v1.7.6"
