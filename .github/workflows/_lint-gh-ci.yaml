name: Lint GitHub CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/**
      - mise.toml

jobs:
  jactionlint:
    name: jactionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install jactionlint
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_NO_HOOKS: "1"
        with:
          version: "2026.10.5"
          install_args: "jactionlint shellcheck"

      - name: jactionlint
        run: jactionlint --pyflakes= --format=github
