[project]
name = "subclean"
version = "0.5.0"
description = "Simple CLI tool to instantly enhance your movie & TV show subtitles."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.15"
authors = [
  { name = "disrupted", email = "hi@salomonpopp.me" },
]
keywords = ["subtitle", "cli", "media", "plex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/disrupted/subclean"
Repository = "https://github.com/disrupted/subclean"
Issues = "https://github.com/disrupted/subclean/issues"

[project.scripts]
subclean = "subclean.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.4",
  "ty>=0.0.101",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ty]
src = { include = ["subclean", "tests"] }

[tool.ty.environment]
python-version = "3.15"

[tool.ruff]
output-format = "grouped"
show-fixes = true
target-version = "py315"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "UP",
  "B",
  "RUF",
  "YTT",
  "BLE",
  "C4",
  "T10",
  "EM",
  "ISC",
  "ICN",
  "INP",
  "PIE",
  "RSE",
  "RET",
  "SLOT",
  "SIM",
  "PTH",
  "PGH",
  "PL",
  "TRY",
]
ignore = [
  "E501",
  "ISC001",
  "PLR09",
  "PLR2004",
  "TRY003",
  "TRY400",
  "RET504",
  "RET505",
  "RUF001",
  "PLW2901",
]

[tool.uv]
package = true
trusted-publishing = "always"
